[package]
name = "servi"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# async-std = "1.12.0"
tokio = { version = "1.36.0", features = ["net", "fs", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1.40"
http = "1.1.0"
thiserror = "1.0.58"
lazy_format = "2.0.3"
mime = "0.3.17"
smallvec = "1.13.2"
serde_json = { version = "1.0.115", optional = true}

[features]
# serde_json = ["dep:serde_json"]
default =  ["serde_json"]

